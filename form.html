<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <h2>Create Form In The HTML</h2>
    <form>
        <h2>Student Registration Form</h2>
        <label>Fullname</label><br>
        <input type="text" name="name" placeholder="Enter Your Name" required><br>
        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter Your E-mail" required><br>
        <label>password</label><br>
        <input type="password" name="password" placeholder="Enter Your Password" required><br>
        <label>date of birth</label><br>
        <input type="date" name="Birthday" required><br>
        <label>class</label><br>
        <select>
            <option value="1">X-1</option>
            <option value="2">X-2</option>
            <option value="3">X-3</option>
            <option value="4">X-4</option>
            <option value="5">X-5</option>
            <option value="6">X-6</option>
            <option value="7">X-7</option>
            <option value="8">X-8</option>
            <option value="9">X-9</option>
        </select><br>
        <label>Gender</label><br>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female<br>
        <label>Skills</label><br>
        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">JavaScript<br>
        <label>About Yourself</label><br>
        <textarea name="about" rows="10" cols="100" placeholder="Write About Yourself Here..." required></textarea><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
